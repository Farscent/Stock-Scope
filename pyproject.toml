[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockscope"
version = "1.0.0"
description = "Stock price and quarterly revenue research for Tesla and GameStop"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3", "numpy>=1.26,<3", "yfinance>=1.2,<2",
    "requests>=2.32,<3", "beautifulsoup4>=4.12,<5",
    "plotly>=6,<7", "streamlit>=1.45,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
